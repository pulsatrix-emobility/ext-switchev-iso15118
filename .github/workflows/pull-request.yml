name: PR Python 🐍 to Switch Repo

on:
  pull_request:
    branches:
      - master
      - bench-2026.02.1

env:
  PYTHON_VERSION: 3.10.5

jobs:
  code-quality-check:
    if: github.repository != 'pulsatrix-emobility/ext-switchev-iso15118'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup the Python Environment by installing Poetry
      uses: ./.github/actions/setup-python-build-env

    - name: Create env file
      run: |
        cp .env.dev.local .env

    - name: Install dependencies
      run: make install-local

    - name: Mypy
      run: make mypy

    - name: Black
      run: make black

    - name: Flake8
      run: make flake8

    - name: isort
      run: make isort

    - name: Tests
      run: make test

  fork-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install runtime and declared test dependencies
        run: |
          pip install -r requirements.txt 'pytest>=7.1.1,<8' 'pytest-asyncio>=0.18.3,<0.24' \
            'pytest-cov>=3,<5' 'asynctest>=0.13,<0.14' 'freezegun>=1.2.1,<2' \
            'aiofile>=3.7.4,<4' 'toml==0.10.2'
      - run: pytest
