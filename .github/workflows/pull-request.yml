name: PR Python 🐍 to Switch Repo

on:
  pull_request:
    branches:
      - master
      - bench-2026.02.1

env:
  PYTHON_VERSION: 3.10.5

jobs:
  code-quality-check:
    if: github.repository != 'pulsatrix-emobility/ext-switchev-iso15118'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup the Python Environment by installing Poetry
      uses: ./.github/actions/setup-python-build-env

    - name: Create env file
      run: |
        cp .env.dev.local .env

    - name: Install dependencies
      run: make install-local

    - name: Mypy
      run: make mypy

    - name: Black
      run: make black

    - name: Flake8
      run: make flake8

    - name: isort
      run: make isort

    - name: Tests
      run: make test

  bench-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      # Pinned upstream conftest imports an unavailable EVSessionContext.
      - run: python -m pytest --confcutdir=tests/iso15118_20 tests/iso15118_20/test_authorization_signature.py -q
